places = "5.3.0"
play-services-maps = "19.0.0"
preference = "1.2.1"
recyclerview = "1.4.0"
room-runtime = "2.8.5"
hilt-version = "2.56.2"
fragment-version = "1.9.1"
junit = "4.13.2"
mockk = "1.13.17"
robolectric = "4.14.1"
turbine = "1.2.0"
androidx-test-core = "1.6.1"
