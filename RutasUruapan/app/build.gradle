plugins {
    alias(libs.plugins.com.android.application)
    alias(libs.plugins.org.jetbrains.kotlin.android)
    alias(libs.plugins.com.dagger.hilt)
    id 'com.google.devtools.ksp'
}

// The API key comes from apikeys.properties locally, or the MAPS_API_KEY env var (e.g. CI).
// When neither is present the build still works; maps and places just won't load at runtime.
def apiKeysFile = rootProject.file("apikeys.properties")
def apiKeysProperties = new Properties()
if (apiKeysFile.exists()) {
    apiKeysFile.withInputStream { apiKeysProperties.load(it) }
}
def mapsAndPlacesApiKey = apiKeysProperties['mapsAndPlaces'] ?: System.getenv("MAPS_API_KEY") ?: ""

android {
    namespace 'com.rico.omarw.rutasuruapan'
    compileSdk 36

    defaultConfig {
        applicationId "com.rico.omarw.rutasuruapan"
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName "1.5.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [mapsAndPlacesAPIKey: mapsAndPlacesApiKey]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.play.services.maps
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.room.runtime
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.preference
    implementation libs.androidx.fragment
    implementation libs.material
    implementation libs.places
    implementation libs.androidx.recyclerview
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.room.ktx
    implementation libs.hilt.android


    ksp libs.androidx.room.compiler
    ksp libs.hilt.android.compiler

    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.robolectric
    testImplementation libs.turbine
    testImplementation libs.androidx.test.core
    testImplementation libs.kotlinx.coroutines.test

}
