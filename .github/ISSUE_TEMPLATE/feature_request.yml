name: Sugerencia / Feature request
description: Propón una mejora o una función nueva. / Suggest an improvement or new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema resolvería? / What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: ¿Cómo te imaginas la solución? / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas / Alternatives considered
