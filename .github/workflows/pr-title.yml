name: PR title

# The PR title becomes the commit message on master (squash merge), so it must follow
# Conventional Commits. See CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the types in CONTRIBUTING.md.
          types: |
            feat
            fix
            refactor
            test
            docs
            ci
            chore
            style
          requireScope: false
          # Summary must start lowercase, e.g. "fix: prevent NPE", not "fix: Prevent NPE".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary "{subject}" in "{title}" must start with a lowercase letter.
