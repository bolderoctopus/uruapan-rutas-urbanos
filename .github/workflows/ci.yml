name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: RutasUruapan

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle downloads and validates gradle-wrapper.jar against official checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: ktlint, detekt and Android Lint
        run: ./gradlew ktlintCheck detekt lintDebug --continue

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            RutasUruapan/app/build/reports/ktlint/
            RutasUruapan/app/build/reports/detekt/
            RutasUruapan/app/build/reports/lint-results-*
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # No Maps API key in CI: the build falls back to an empty key, which unit tests don't need.
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: RutasUruapan/app/build/reports/tests/
          retention-days: 7
